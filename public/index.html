<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Docker To-Do App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 40px 16px; }
    .container { background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); height: fit-content; }
    h1 { font-size: 1.8rem; color: #2d3748; margin-bottom: 8px; }
    .subtitle { color: #718096; font-size: 0.9rem; margin-bottom: 24px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 24px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #4299e1; }
    button.add-btn { background: #4299e1; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button.add-btn:hover { background: #2b6cb0; }
    .task-list { list-style: none; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
    .task-title { color: #2d3748; font-size: 1rem; }
    button.del-btn { background: #fc8181; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    button.del-btn:hover { background: #e53e3e; }
    .empty-msg { text-align: center; color: #a0aec0; padding: 20px 0; }
    .count { color: #718096; font-size: 0.85rem; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 To-Do App</h1>
    <p class="subtitle">Running inside a Docker Container </p>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>
    <div class="count" id="taskCount">0 tasks</div>
    <ul class="task-list" id="taskList"></ul>
  </div>
  <script>
    async function loadTasks() {
      const res = await fetch("/tasks");
      const tasks = await res.json();
      renderTasks(tasks);
    }
    function renderTasks(tasks) {
      const list = document.getElementById("taskList");
      const count = document.getElementById("taskCount");
      count.textContent = tasks.length + " task" + (tasks.length !== 1 ? "s" : "");
      if (tasks.length === 0) {
        list.innerHTML = '<p class="empty-msg">No tasks yet. Add one above!</p>';
        return;
      }
      list.innerHTML = tasks.map(t => `
        <li class="task-item">
          <span class="task-title">${escapeHtml(t.title)}</span>
          <button class="del-btn" onclick="deleteTask(${t.id})">Delete</button>
        </li>
      `).join("");
    }
    async function addTask() {
      const input = document.getElementById("taskInput");
      const title = input.value.trim();
      if (!title) return;
      await fetch("/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title })
      });
      input.value = "";
      loadTasks();
    }
    async function deleteTask(id) {
      await fetch("/tasks/" + id, { method: "DELETE" });
      loadTasks();
    }
    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    document.getElementById("taskInput").addEventListener("keypress", e => {
      if (e.key === "Enter") addTask();
    });
    loadTasks();
  </script>
</body>
</html>
